<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe 微表情识别 POC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e5e7eb;
      min-height: 100vh;
    }
    header {
      padding: 16px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .status { font-size: 13px; color: #8b949e; }
    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .video-wrap {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/10;
      max-height: 70vh;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas { pointer-events: none; }
    .panel {
      width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 15px; color: #c9d1d9; }
    .au-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
    .au-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      background: #0d1117;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .bar-wrap { flex: 1; height: 6px; background: #21262d; border-radius: 3px; margin: 0 10px; overflow: hidden; }
    .bar { height: 100%; background: #58a6ff; border-radius: 3px; transition: width 0.1s; }
    .emotion {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, #1f6feb33, #8957e533);
      border-radius: 8px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .meta { font-size: 12px; color: #8b949e; line-height: 1.5; }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { background: #30363d; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #2ea043; }
    .warning { color: #f85149; font-size: 12px; }
    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .panel { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MediaPipe 微表情识别 POC</h1>
    <div class="status" id="status">准备中...</div>
  </header>

  <div class="container">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="panel">
      <div>
        <h2>当前主导情绪</h2>
        <div class="emotion" id="emotion">等待检测</div>
      </div>

      <div>
        <h2>关键 AU / Blendshapes（平滑后）</h2>
        <div class="au-list" id="auList"></div>
      </div>

      <div class="meta" id="meta">
        帧率: -- fps<br>
        人脸置信度: --<br>
        基线状态: 未校准
      </div>

      <div>
        <button id="startBtn">启动摄像头</button>
        <button id="calibrateBtn" disabled style="margin-left:8px; background:#1f6feb;">校准基线</button>
      </div>
      <div class="warning" id="warning"></div>
    </div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/vision_bundle.mjs';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const emotionEl = document.getElementById('emotion');
    const auListEl = document.getElementById('auList');
    const metaEl = document.getElementById('meta');
    const startBtn = document.getElementById('startBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const warningEl = document.getElementById('warning');

    let faceLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let fps = 0;

    // EMA 平滑
    const smoothed = {};
    const ALPHA = 0.35;

    // 简单 AU 映射（基于常见 blendshape → AU 近似）
    const AU_MAP = [
      { au: 'AU1', name: 'Inner Brow Raiser', keys: ['browInnerUp'] },
      { au: 'AU2', name: 'Outer Brow Raiser', keys: ['browOuterUpLeft', 'browOuterUpRight'] },
      { au: 'AU4', name: 'Brow Lowerer', keys: ['browDownLeft', 'browDownRight'] },
      { au: 'AU5', name: 'Upper Lid Raiser', keys: ['eyeWideLeft', 'eyeWideRight'] },
      { au: 'AU6', name: 'Cheek Raiser', keys: ['cheekSquintLeft', 'cheekSquintRight'] },
      { au: 'AU12', name: 'Lip Corner Puller', keys: ['mouthSmileLeft', 'mouthSmileRight'] },
      { au: 'AU15', name: 'Lip Corner Depressor', keys: ['mouthFrownLeft', 'mouthFrownRight'] },
      { au: 'AU26', name: 'Jaw Drop', keys: ['jawOpen'] },
      { au: 'AU45', name: 'Blink', keys: ['eyeBlinkLeft', 'eyeBlinkRight'] },
    ];

    const EMOTION_RULES = [
      { name: '😊 高兴', score: (aus) => (aus.AU6 || 0) * 0.6 + (aus.AU12 || 0) * 1.0 },
      { name: '😮 惊讶', score: (aus) => (aus.AU1 || 0) * 0.5 + (aus.AU2 || 0) * 0.5 + (aus.AU5 || 0) * 0.8 + (aus.AU26 || 0) * 0.7 },
      { name: '😠 愤怒', score: (aus) => (aus.AU4 || 0) * 1.0 + (aus.AU5 || 0) * 0.3 },
      { name: '😢 悲伤', score: (aus) => (aus.AU1 || 0) * 0.4 + (aus.AU4 || 0) * 0.5 + (aus.AU15 || 0) * 0.8 },
      { name: '😐 中性', score: () => 0.15 },
    ];

    async function initMediaPipe() {
      statusEl.textContent = '加载模型中...';
      const filesetResolver = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm'
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1,
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: true
      });
      statusEl.textContent = '模型加载完成，点击启动摄像头';
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        startBtn.disabled = true;
        calibrateBtn.disabled = false;
        statusEl.textContent = '检测中';
        requestAnimationFrame(loop);
      } catch (e) {
        warningEl.textContent = '摄像头权限被拒绝或设备不可用：' + e.message;
      }
    }

    function getBlendshapeMap(result) {
      const map = {};
      if (!result.faceBlendshapes || !result.faceBlendshapes[0]) return map;
      for (const b of result.faceBlendshapes[0].categories) {
        map[b.categoryName] = b.score;
      }
      return map;
    }

    function computeAUs(blendMap) {
      const aus = {};
      for (const item of AU_MAP) {
        let val = 0;
        for (const k of item.keys) {
          val += blendMap[k] || 0;
        }
        val /= item.keys.length;
        // EMA
        if (smoothed[item.au] === undefined) smoothed[item.au] = val;
        else smoothed[item.au] = ALPHA * val + (1 - ALPHA) * smoothed[item.au];
        aus[item.au] = smoothed[item.au];
      }
      return aus;
    }

    function getDominantEmotion(aus) {
      let best = EMOTION_RULES[0];
      let bestScore = -1;
      for (const rule of EMOTION_RULES) {
        const s = rule.score(aus);
        if (s > bestScore) {
          bestScore = s;
          best = rule;
        }
      }
      return bestScore > 0.25 ? best.name : '😐 中性';
    }

    function drawLandmarks(landmarks) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!landmarks || !landmarks[0]) return;
      ctx.strokeStyle = 'rgba(88, 166, 255, 0.6)';
      ctx.lineWidth = 1;
      const pts = landmarks[0];
      const keyIndices = [33, 133, 362, 263, 61, 291, 0, 17];
      ctx.fillStyle = '#58a6ff';
      for (const i of keyIndices) {
        if (pts[i]) {
          const x = pts[i].x * canvas.width;
          const y = pts[i].y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function renderAUList(aus) {
      auListEl.innerHTML = '';
      for (const item of AU_MAP) {
        const v = aus[item.au] || 0;
        const div = document.createElement('div');
        div.className = 'au-item';
        div.innerHTML = `
          <span>${item.au}</span>
          <div class="bar-wrap"><div class="bar" style="width:${Math.min(100, v * 200)}%"></div></div>
          <span>${(v * 100).toFixed(0)}%</span>
        `;
        auListEl.appendChild(div);
      }
    }

    function loop() {
      if (!running) return;
      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = faceLandmarker.detectForVideo(video, now);
        frameCount++;

        if (result.faceLandmarks && result.faceLandmarks.length > 0) {
          const blendMap = getBlendshapeMap(result);
          const aus = computeAUs(blendMap);
          const emotion = getDominantEmotion(aus);
          emotionEl.textContent = emotion;
          renderAUList(aus);
          drawLandmarks(result.faceLandmarks);
          warningEl.textContent = '';
        } else {
          emotionEl.textContent = '未检测到人脸';
          warningEl.textContent = '请正对摄像头，保证光线充足';
        }

        if (now - lastFpsTime > 1000) {
          fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
          frameCount = 0;
          lastFpsTime = now;
        }
        metaEl.innerHTML = `帧率: ${fps} fps<br>人脸: ${result.faceLandmarks?.length || 0}<br>平滑系数 α=${ALPHA}`;
      }
      requestAnimationFrame(loop);
    }

    startBtn.onclick = startCamera;
    calibrateBtn.onclick = () => {
      Object.keys(smoothed).forEach(k => delete smoothed[k]);
      statusEl.textContent = '基线已重置（当前帧作为新起点）';
    };

    initMediaPipe().catch(e => {
      statusEl.textContent = '模型加载失败';
      warningEl.textContent = e.message;
      console.error(e);
    });
  </script>
</body>
</html>
