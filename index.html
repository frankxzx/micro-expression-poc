<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>微表情 + 肢体</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(11,14,20,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
    .status { font-size: 13px; color: var(--muted); }
    .main { padding: 12px; max-width: 480px; margin: 0 auto; }
    .video-box {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4/3;
      margin-bottom: 12px;
    }
    video, canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas { pointer-events: none; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .emotion {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      padding: 18px 12px;
      background: linear-gradient(135deg, #1f6feb22, #8957e522);
      border-radius: 10px;
    }
    .pose { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .au-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; margin: 6px 0;
    }
    .au-name { width: 42px; color: var(--muted); }
    .bar-bg { flex: 1; height: 5px; background: #21262d; border-radius: 3px; overflow: hidden; }
    .bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .12s; }
    .au-val { width: 36px; text-align: right; color: var(--muted); }
    .meta { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #1f6feb; }
    button:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
    .warn { color: var(--red); font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
    .loading-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>微表情 + 肢体</h1>
    <div class="status" id="status">准备中</div>
  </header>
  <div class="main">
    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="loading-overlay" id="overlay">模型加载中…</div>
    </div>

    <div class="card">
      <h2>情绪</h2>
      <div class="emotion" id="emotion">—</div>
    </div>

    <div class="card">
      <h2>姿态</h2>
      <div class="pose" id="poseInfo">等待检测</div>
    </div>

    <div class="card">
      <h2>关键 AU</h2>
      <div id="auList"></div>
    </div>

    <div class="meta" id="meta">帧率 — · 人脸 — · 姿态 —</div>
    <div class="btn-row">
      <button id="startBtn" disabled>启动摄像头</button>
      <button id="calibrateBtn" class="secondary" disabled>校准</button>
    </div>
    <div class="warn" id="warning"></div>
  </div>

  <script type="module">
    import { FaceLandmarker, PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/vision_bundle.mjs';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const emotionEl = document.getElementById('emotion');
    const poseInfoEl = document.getElementById('poseInfo');
    const auListEl = document.getElementById('auList');
    const metaEl = document.getElementById('meta');
    const startBtn = document.getElementById('startBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const warningEl = document.getElementById('warning');
    const overlay = document.getElementById('overlay');

    let faceLandmarker = null, poseLandmarker = null;
    let running = false, lastVideoTime = -1;
    let frameCount = 0, lastFpsTime = performance.now(), fps = 0;
    const smoothed = {}, ALPHA = 0.35;

    const AU_MAP = [
      { au: 'AU1', keys: ['browInnerUp'] },
      { au: 'AU2', keys: ['browOuterUpLeft','browOuterUpRight'] },
      { au: 'AU4', keys: ['browDownLeft','browDownRight'] },
      { au: 'AU5', keys: ['eyeWideLeft','eyeWideRight'] },
      { au: 'AU6', keys: ['cheekSquintLeft','cheekSquintRight'] },
      { au: 'AU12', keys: ['mouthSmileLeft','mouthSmileRight'] },
      { au: 'AU15', keys: ['mouthFrownLeft','mouthFrownRight'] },
      { au: 'AU26', keys: ['jawOpen'] },
      { au: 'AU45', keys: ['eyeBlinkLeft','eyeBlinkRight'] },
    ];
    const EMOTION_RULES = [
      { name: '😊 高兴', score: a => (a.AU6||0)*0.6+(a.AU12||0)*1.0 },
      { name: '😮 惊讶', score: a => (a.AU1||0)*0.5+(a.AU2||0)*0.5+(a.AU5||0)*0.8+(a.AU26||0)*0.7 },
      { name: '😠 愤怒', score: a => (a.AU4||0)*1.0+(a.AU5||0)*0.3 },
      { name: '😢 悲伤', score: a => (a.AU1||0)*0.4+(a.AU4||0)*0.5+(a.AU15||0)*0.8 },
      { name: '😐 中性', score: () => 0.15 },
    ];
    const POSE = { L_SHOULDER:11, R_SHOULDER:12, L_WRIST:15, R_WRIST:16, L_HIP:23, R_HIP:24 };

    async function init() {
      statusEl.textContent = '加载中';
      overlay.textContent = '加载 Face 模型…';
      try {
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm');

        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true
        });
        overlay.textContent = 'Face 完成，加载 Pose…';
        statusEl.textContent = '人脸就绪';
        startBtn.disabled = false;
        overlay.style.display = 'none';

        PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO', numPoses: 1
        }).then(p => {
          poseLandmarker = p;
          statusEl.textContent = '全部就绪';
        }).catch(e => {
          warningEl.textContent = 'Pose 加载失败，仅人脸可用';
          console.error(e);
        });
      } catch (e) {
        statusEl.textContent = '加载失败';
        overlay.textContent = '加载失败';
        warningEl.textContent = e.message;
        console.error(e);
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        startBtn.disabled = true;
        calibrateBtn.disabled = false;
        statusEl.textContent = '检测中';
        requestAnimationFrame(loop);
      } catch (e) {
        warningEl.textContent = '摄像头失败：' + e.message;
      }
    }

    function getBlendshapeMap(r) {
      const m = {};
      if (!r?.faceBlendshapes?.[0]) return m;
      for (const b of r.faceBlendshapes[0].categories) m[b.categoryName] = b.score;
      return m;
    }
    function computeAUs(bm) {
      const aus = {};
      for (const it of AU_MAP) {
        let v = 0;
        for (const k of it.keys) v += bm[k] || 0;
        v /= it.keys.length;
        smoothed[it.au] = smoothed[it.au] === undefined ? v : ALPHA*v + (1-ALPHA)*smoothed[it.au];
        aus[it.au] = smoothed[it.au];
      }
      return aus;
    }
    function getEmotion(aus) {
      let best = EMOTION_RULES[0], bs = -1;
      for (const r of EMOTION_RULES) {
        const s = r.score(aus);
        if (s > bs) { bs = s; best = r; }
      }
      return bs > 0.25 ? best.name : '😐 中性';
    }
    function analyzePose(lm) {
      if (!lm?.length) return '未检测到姿态';
      const p = lm[0];
      const ls = p[POSE.L_SHOULDER], rs = p[POSE.R_SHOULDER];
      if (!ls || !rs) return '上半身不完整';
      const sw = Math.abs(ls.x - rs.x);
      const lw = p[POSE.L_WRIST], rw = p[POSE.R_WRIST];
      const spread = ((lw?Math.abs(lw.x-ls.x):0) + (rw?Math.abs(rw.x-rs.x):0)) / 2;
      const open = spread > sw*0.6 ? '开放' : (spread < sw*0.3 ? '封闭' : '中性');
      let lean = '直立';
      const lh = p[POSE.L_HIP], rh = p[POSE.R_HIP];
      if (lh && rh) {
        const sy = (ls.y+rs.y)/2, hy = (lh.y+rh.y)/2;
        if (sy < hy-0.05) lean = '前倾';
        else if (sy > hy+0.02) lean = '后仰';
      }
      return `姿态 ${open}\n身体 ${lean}\n肩宽比 ${sw.toFixed(2)}`;
    }
    function drawPose(lm) {
      if (!lm?.length) return;
      const pts = lm[0];
      ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2; ctx.fillStyle = '#3fb950';
      for (const [a,b] of [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]]) {
        if (pts[a] && pts[b]) {
          ctx.beginPath();
          ctx.moveTo(pts[a].x*canvas.width, pts[a].y*canvas.height);
          ctx.lineTo(pts[b].x*canvas.width, pts[b].y*canvas.height);
          ctx.stroke();
        }
      }
      for (const i of [11,12,13,14,15,16,23,24]) {
        if (pts[i]) {
          ctx.beginPath();
          ctx.arc(pts[i].x*canvas.width, pts[i].y*canvas.height, 4, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
    function drawFace(lm) {
      if (!lm?.[0]) return;
      ctx.fillStyle = '#58a6ff';
      for (const i of [33,133,362,263,61,291,0,17]) {
        if (lm[0][i]) {
          ctx.beginPath();
          ctx.arc(lm[0][i].x*canvas.width, lm[0][i].y*canvas.height, 3, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
    function renderAUs(aus) {
      auListEl.innerHTML = '';
      for (const it of AU_MAP) {
        const v = aus[it.au] || 0;
        const d = document.createElement('div');
        d.className = 'au-row';
        d.innerHTML = `<span class="au-name">${it.au}</span><div class="bar-bg"><div class="bar" style="width:${Math.min(100,v*200)}%"></div></div><span class="au-val">${(v*100).toFixed(0)}%</span>`;
        auListEl.appendChild(d);
      }
    }

    function loop() {
      if (!running) return;
      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        frameCount++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let fc = 0, pc = 0;

        if (faceLandmarker) {
          const fr = faceLandmarker.detectForVideo(video, now);
          if (fr.faceLandmarks?.length) {
            fc = fr.faceLandmarks.length;
            const aus = computeAUs(getBlendshapeMap(fr));
            emotionEl.textContent = getEmotion(aus);
            renderAUs(aus);
            drawFace(fr.faceLandmarks);
          } else emotionEl.textContent = '未检测到人脸';
        }
        if (poseLandmarker) {
          const pr = poseLandmarker.detectForVideo(video, now);
          const lm = pr.landmarks || pr.poseLandmarks || [];
          if (lm.length) {
            pc = lm.length;
            poseInfoEl.textContent = analyzePose(lm);
            drawPose(lm);
          } else poseInfoEl.textContent = '未检测到姿态';
        } else poseInfoEl.textContent = 'Pose 加载中…';

        if (now - lastFpsTime > 1000) {
          fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
          frameCount = 0; lastFpsTime = now;
        }
        metaEl.textContent = `帧率 ${fps} fps · 人脸 ${fc} · 姿态 ${pc}`;
      }
      requestAnimationFrame(loop);
    }

    startBtn.onclick = startCamera;
    calibrateBtn.onclick = () => { Object.keys(smoothed).forEach(k => delete smoothed[k]); statusEl.textContent = '已校准'; };
    init();
  </script>
</body>
</html>
