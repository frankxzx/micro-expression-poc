<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe 微表情 + 肢体 POC</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e5e7eb; min-height: 100vh; }
    header { padding: 16px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 18px; }
    .status { font-size: 13px; color: #8b949e; }
    .container { display: flex; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
    .video-wrap { position: relative; flex: 1; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/10; max-height: 70vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { pointer-events: none; }
    .panel { width: 380px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .panel h2 { margin: 0 0 8px; font-size: 15px; color: #c9d1d9; }
    .au-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
    .au-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; background: #0d1117; padding: 6px 10px; border-radius: 6px; }
    .bar-wrap { flex: 1; height: 6px; background: #21262d; border-radius: 3px; margin: 0 10px; overflow: hidden; }
    .bar { height: 100%; background: #58a6ff; border-radius: 3px; }
    .emotion { font-size: 24px; font-weight: 700; text-align: center; padding: 12px; background: linear-gradient(135deg, #1f6feb33, #8957e533); border-radius: 8px; min-height: 56px; display: flex; align-items: center; justify-content: center; }
    .pose-info { font-size: 13px; background: #0d1117; padding: 10px; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; }
    .meta { font-size: 12px; color: #8b949e; line-height: 1.5; }
    button { background: #238636; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #30363d; cursor: not-allowed; }
    .warning { color: #f85149; font-size: 12px; white-space: pre-wrap; }
    @media (max-width: 900px) { .container { flex-direction: column; } .panel { width: 100%; } }
  </style>
</head>
<body>
  <header>
    <h1>MediaPipe 微表情 + 肢体 POC</h1>
    <div class="status" id="status">准备中...</div>
  </header>
  <div class="container">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="panel">
      <div><h2>当前主导情绪</h2><div class="emotion" id="emotion">等待检测</div></div>
      <div><h2>肢体姿态</h2><div class="pose-info" id="poseInfo">等待检测</div></div>
      <div><h2>关键 AU（平滑后）</h2><div class="au-list" id="auList"></div></div>
      <div class="meta" id="meta">帧率: -- fps<br>人脸: -- | 姿态: --</div>
      <div>
        <button id="startBtn" disabled>启动摄像头</button>
        <button id="calibrateBtn" disabled style="margin-left:8px; background:#1f6feb;">校准基线</button>
      </div>
      <div class="warning" id="warning"></div>
    </div>
  </div>
  <script type="module">
    import { FaceLandmarker, PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/vision_bundle.mjs';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const emotionEl = document.getElementById('emotion');
    const poseInfoEl = document.getElementById('poseInfo');
    const auListEl = document.getElementById('auList');
    const metaEl = document.getElementById('meta');
    const startBtn = document.getElementById('startBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const warningEl = document.getElementById('warning');

    let faceLandmarker = null;
    let poseLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let fps = 0;
    const smoothed = {};
    const ALPHA = 0.35;

    const AU_MAP = [
      { au: 'AU1', keys: ['browInnerUp'] },
      { au: 'AU2', keys: ['browOuterUpLeft', 'browOuterUpRight'] },
      { au: 'AU4', keys: ['browDownLeft', 'browDownRight'] },
      { au: 'AU5', keys: ['eyeWideLeft', 'eyeWideRight'] },
      { au: 'AU6', keys: ['cheekSquintLeft', 'cheekSquintRight'] },
      { au: 'AU12', keys: ['mouthSmileLeft', 'mouthSmileRight'] },
      { au: 'AU15', keys: ['mouthFrownLeft', 'mouthFrownRight'] },
      { au: 'AU26', keys: ['jawOpen'] },
      { au: 'AU45', keys: ['eyeBlinkLeft', 'eyeBlinkRight'] },
    ];
    const EMOTION_RULES = [
      { name: '😊 高兴', score: a => (a.AU6||0)*0.6 + (a.AU12||0)*1.0 },
      { name: '😮 惊讶', score: a => (a.AU1||0)*0.5 + (a.AU2||0)*0.5 + (a.AU5||0)*0.8 + (a.AU26||0)*0.7 },
      { name: '😠 愤怒', score: a => (a.AU4||0)*1.0 + (a.AU5||0)*0.3 },
      { name: '😢 悲伤', score: a => (a.AU1||0)*0.4 + (a.AU4||0)*0.5 + (a.AU15||0)*0.8 },
      { name: '😐 中性', score: () => 0.15 },
    ];
    const POSE = { L_SHOULDER: 11, R_SHOULDER: 12, L_WRIST: 15, R_WRIST: 16, L_HIP: 23, R_HIP: 24 };

    async function initMediaPipe() {
      statusEl.textContent = '加载模型中（并行）...';
      warningEl.textContent = 'Face 与 Pose 同时下载，请稍等...';
      try {
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm');

        const facePromise = FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1,
          outputFaceBlendshapes: true
        });

        const posePromise = PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numPoses: 1
        });

        const results = await Promise.allSettled([facePromise, posePromise]);

        if (results[0].status === 'fulfilled') {
          faceLandmarker = results[0].value;
        } else {
          throw new Error('Face 模型失败: ' + results[0].reason?.message);
        }

        if (results[1].status === 'fulfilled') {
          poseLandmarker = results[1].value;
          statusEl.textContent = 'Face + Pose 加载完成';
          warningEl.textContent = '';
        } else {
          statusEl.textContent = '仅人脸可用（Pose 失败）';
          warningEl.textContent = 'Pose 加载失败：' + results[1].reason?.message;
          console.error(results[1].reason);
        }

        startBtn.disabled = false;
      } catch (e) {
        statusEl.textContent = '模型加载失败';
        warningEl.textContent = '加载失败：' + e.message;
        console.error(e);
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        startBtn.disabled = true;
        calibrateBtn.disabled = false;
        statusEl.textContent = '检测中';
        requestAnimationFrame(loop);
      } catch (e) {
        warningEl.textContent = '摄像头失败：' + e.message;
      }
    }

    function getBlendshapeMap(result) {
      const map = {};
      if (!result?.faceBlendshapes?.[0]) return map;
      for (const b of result.faceBlendshapes[0].categories) map[b.categoryName] = b.score;
      return map;
    }
    function computeAUs(blendMap) {
      const aus = {};
      for (const item of AU_MAP) {
        let val = 0;
        for (const k of item.keys) val += blendMap[k] || 0;
        val /= item.keys.length;
        smoothed[item.au] = smoothed[item.au] === undefined ? val : ALPHA * val + (1 - ALPHA) * smoothed[item.au];
        aus[item.au] = smoothed[item.au];
      }
      return aus;
    }
    function getDominantEmotion(aus) {
      let best = EMOTION_RULES[0], bestScore = -1;
      for (const r of EMOTION_RULES) {
        const s = r.score(aus);
        if (s > bestScore) { bestScore = s; best = r; }
      }
      return bestScore > 0.25 ? best.name : '😐 中性';
    }

    function analyzePose(landmarks) {
      if (!landmarks?.length) return '未检测到姿态';
      const p = landmarks[0];
      const ls = p[POSE.L_SHOULDER], rs = p[POSE.R_SHOULDER];
      if (!ls || !rs) return '上半身不完整';
      const sw = Math.abs(ls.x - rs.x);
      const lw = p[POSE.L_WRIST], rw = p[POSE.R_WRIST];
      const spread = ((lw ? Math.abs(lw.x - ls.x) : 0) + (rw ? Math.abs(rw.x - rs.x) : 0)) / 2;
      let open = spread > sw * 0.6 ? '开放' : (spread < sw * 0.3 ? '封闭' : '中性');
      let lean = '直立';
      const lh = p[POSE.L_HIP], rh = p[POSE.R_HIP];
      if (lh && rh) {
        const sy = (ls.y + rs.y) / 2, hy = (lh.y + rh.y) / 2;
        if (sy < hy - 0.05) lean = '前倾';
        else if (sy > hy + 0.02) lean = '后仰';
      }
      return `姿态：${open}\n身体：${lean}\n肩宽比：${sw.toFixed(2)}\n点数：${p.length}`;
    }

    function drawPose(landmarks) {
      if (!landmarks?.length) return;
      const pts = landmarks[0];
      ctx.strokeStyle = '#3fb950';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#3fb950';
      const conns = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
      for (const [a,b] of conns) {
        if (pts[a] && pts[b]) {
          ctx.beginPath();
          ctx.moveTo(pts[a].x * canvas.width, pts[a].y * canvas.height);
          ctx.lineTo(pts[b].x * canvas.width, pts[b].y * canvas.height);
          ctx.stroke();
        }
      }
      for (const i of [11,12,13,14,15,16,23,24]) {
        if (pts[i]) {
          ctx.beginPath();
          ctx.arc(pts[i].x * canvas.width, pts[i].y * canvas.height, 5, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
    function drawFace(landmarks) {
      if (!landmarks?.[0]) return;
      ctx.fillStyle = '#58a6ff';
      const pts = landmarks[0];
      for (const i of [33,133,362,263,61,291,0,17]) {
        if (pts[i]) {
          ctx.beginPath();
          ctx.arc(pts[i].x * canvas.width, pts[i].y * canvas.height, 3, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
    function renderAUList(aus) {
      auListEl.innerHTML = '';
      for (const item of AU_MAP) {
        const v = aus[item.au] || 0;
        const d = document.createElement('div');
        d.className = 'au-item';
        d.innerHTML = `<span>${item.au}</span><div class="bar-wrap"><div class="bar" style="width:${Math.min(100,v*200)}%"></div></div><span>${(v*100).toFixed(0)}%</span>`;
        auListEl.appendChild(d);
      }
    }

    function loop() {
      if (!running) return;
      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        frameCount++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let faceCount = 0, poseCount = 0;

        if (faceLandmarker) {
          const fr = faceLandmarker.detectForVideo(video, now);
          if (fr.faceLandmarks?.length) {
            faceCount = fr.faceLandmarks.length;
            const aus = computeAUs(getBlendshapeMap(fr));
            emotionEl.textContent = getDominantEmotion(aus);
            renderAUList(aus);
            drawFace(fr.faceLandmarks);
          } else emotionEl.textContent = '未检测到人脸';
        }

        if (poseLandmarker) {
          const pr = poseLandmarker.detectForVideo(video, now);
          const lm = pr.landmarks || pr.poseLandmarks || [];
          if (lm.length) {
            poseCount = lm.length;
            poseInfoEl.textContent = analyzePose(lm);
            drawPose(lm);
          } else {
            poseInfoEl.textContent = '未检测到姿态（模型已加载）';
          }
        } else {
          poseInfoEl.textContent = 'Pose 模型未加载';
        }

        if (now - lastFpsTime > 1000) {
          fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
          frameCount = 0;
          lastFpsTime = now;
        }
        metaEl.innerHTML = `帧率: ${fps} fps<br>人脸: ${faceCount} | 姿态: ${poseCount}`;
      }
      requestAnimationFrame(loop);
    }

    startBtn.onclick = startCamera;
    calibrateBtn.onclick = () => { Object.keys(smoothed).forEach(k => delete smoothed[k]); statusEl.textContent = '基线已重置'; };
    initMediaPipe();
  </script>
</body>
</html>
